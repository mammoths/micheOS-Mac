<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meili Studio</title><meta name="description" content="Plan Meili stories, references and Higgsfield shots."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f2a44'/%3E%3Ctext x='6' y='24' font-size='24' fill='%23fff' font-family='serif'%3EM%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#">Meili<span>STUDIO</span></a><div class="file-actions"><button id="new">New project</button><button id="open">Open project</button><button id="save" class="primary">Save project</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<main><aside><div class="eyebrow">THE DAILY MEILI</div><h1>Make a little<br>world.</h1><p>Start with a story. Give each shot a job.</p><label for="preset">Start from</label><select id="preset"><option value="skate">Meili on Wheels</option><option value="palace">Palace Meili</option><option value="blank">Blank project</option></select><nav aria-label="Project stages"><button data-tab="story" class="active" aria-current="page"><span>01</span>Story</button><button data-tab="references"><span>02</span>References</button><button data-tab="shots"><span>03</span>Shots & prompts</button><button data-tab="vote"><span>04</span>Next episode</button></nav><div class="aside-note">Higgsfield handoff<br><small>Copy prompts and attach your references in Higgsfield.</small></div></aside>
<section class="workspace"><div class="workspace-head"><div><div class="eyebrow" id="section-kicker">01 / STORY</div><h2 id="project-title">First coast</h2></div><span class="pill">Draft</span></div><div id="content"></div><footer><span id="save-state">Unsaved draft · save a project file to keep it</span><span>Private workspace</span></footer></section></main><div id="notice" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
